<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=contain, interactive-widget=resizes-content">
  <meta name="theme-color" content="#fff8ee">
  <meta name="description" content="Kelimeleri birbirine bağla. Türkçe kelime zinciri bulmacasını tek başına veya arkadaşlarınla aynı ekranda oyna.">
  <title>$GODOT_PROJECT_NAME</title>
  <style>
    :root { color-scheme: light; --app-height: 100dvh; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff8ee; }
    body { font-family: "Trebuchet MS", Arial, sans-serif; color: #29364f; overscroll-behavior: none; }
    #canvas { display: block; width: 100% !important; height: var(--app-height) !important; outline: none; touch-action: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 28px; background: #fff8ee; text-align: center; }
    .loading-mascot { width: 120px; height: 120px; object-fit: contain; }
    h1 { margin: 8px 0 0; max-width: 440px; font-size: clamp(30px, 8vw, 42px); font-weight: 900; letter-spacing: -1px; }
    #loading p { margin: 0; font-size: 16px; line-height: 1.5; max-width: 390px; }
    progress { width: min(280px, 80vw); height: 14px; border: 2px solid #29364f; border-radius: 20px; overflow: hidden; background: #ece7dd; }
    progress::-webkit-progress-bar { background: #ece7dd; }
    progress::-webkit-progress-value { background: #2ba99e; border-radius: 12px; }
    progress::-moz-progress-bar { background: #2ba99e; border-radius: 12px; }
    #retry { padding: 12px 20px; border: 2px solid #29364f; border-radius: 12px; background: #ffca51; color: #29364f; font: inherit; font-weight: bold; cursor: pointer; }
    [hidden] { display: none !important; }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="Sözcük Zinciri oyunu">Bu oyun için güncel ve WebGL 2 destekleyen bir tarayıcı gerekiyor.</canvas>
  <div id="loading" role="status" aria-live="polite">
    <img class="loading-mascot" src="index.png" alt="Gazetesindeki kelime bulmacasını çözen mavi damla maskot" width="120" height="120">
    <h1>Sözcük Zinciri</h1>
    <p id="message">Kelimeler yerini alıyor…</p>
    <progress id="progress" max="100"></progress>
    <button id="retry" hidden onclick="location.reload()">Yeniden dene</button>
  </div>
  <noscript>Oyunu açmak için tarayıcında JavaScript'i etkinleştir.</noscript>
  <script src="$GODOT_URL"></script>
  <script>
    (() => {
      const canvas = document.getElementById('canvas');
      const overlay = document.getElementById('loading');
      const progress = document.getElementById('progress');
      const message = document.getElementById('message');
      window.__zincirKeyboardInset = 0;
      window.__zincirViewportHeight = window.innerHeight;
      // Godot's adaptive policy measures innerHeight, which Safari may leave
      // unchanged above its keyboard. Policy 0 lets this shell resize the real
      // framebuffer rather than merely squeezing the canvas with CSS.
      function fitViewport() {
        const viewport = window.visualViewport;
        const visibleHeight = viewport ? viewport.height : window.innerHeight;
        window.__zincirKeyboardInset = Math.max(0, window.innerHeight - visibleHeight);
        window.__zincirViewportHeight = visibleHeight;
        document.documentElement.style.setProperty('--app-height', Math.round(visibleHeight) + 'px');
        const pixelRatio = window.devicePixelRatio || 1;
        const width = Math.max(1, Math.round(window.innerWidth * pixelRatio));
        const height = Math.max(1, Math.round(visibleHeight * pixelRatio));
        if (canvas.width !== width) canvas.width = width;
        if (canvas.height !== height) canvas.height = height;
      }
      fitViewport();
      window.addEventListener('resize', fitViewport);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', fitViewport);
        window.visualViewport.addEventListener('scroll', fitViewport);
      }
      function failure(error) {
        console.error(error);
        message.textContent = location.protocol === 'file:'
          ? 'Oyunu dosyaya çift tıklayarak açamazsın. tools/serve.ps1 ile yerel sunucuyu başlat.'
          : 'Oyun yüklenemedi. İnternet bağlantını kontrol et ve WebGL 2 destekleyen güncel bir tarayıcıyla yeniden dene.';
        progress.hidden = true;
        document.getElementById('retry').hidden = false;
      }
      const missing = Engine.getMissingFeatures({ threads: false });
      if (missing.length) {
        failure(new Error(missing.join(', ')));
        return;
      }
      const engine = new Engine($GODOT_CONFIG);
      engine.startGame({
        canvas,
        canvasResizePolicy: 0,
        onProgress(current, total) {
          if (total > 0) progress.value = current / total * 100;
          else progress.removeAttribute('value');
        }
      }).then(() => {
        overlay.remove();
        fitViewport();
      }).catch(failure);
    })();
  </script>
</body>
</html>
