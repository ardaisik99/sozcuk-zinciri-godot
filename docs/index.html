function normalizeTurkish(value) {
  return String(value ?? '').trim().replaceAll('i', 'İ').replaceAll('ı', 'I')
    .toLocaleUpperCase('tr-TR').replace(/\s+/gu, '');
}

const clone = value => JSON.parse(JSON.stringify(value));
const object = value => value !== null && typeof value === 'object' && !Array.isArray(value);
const integer = (value, fallback = 0, max = 99999999) => {
  const number = typeof value === 'number' ? value : typeof value === 'string' && /^-?\d+$/.test(value) ? Number(value) : NaN;
  return Number.isFinite(number) ? Math.max(0, Math.min(max, Math.trunc(number))) : fallback;
};
const storageDefault = () => { try { return globalThis.localStorage ?? null; } catch { return null; } };
const validLevel = level => object(level) && typeof level.id === 'string' && level.id
  && Array.isArray(level.words) && level.words.length >= 4 && level.words.length <= 5
  && level.words.every(word => typeof word === 'string' && word && normalizeTurkish(word) === word)
  && Array.isArray(level.answers) && level.answers.length === level.words.length
  && level.answers.every(word => typeof word === 'string' && word && normalizeTurkish(word) === word)
  && level.answers[0] === level.words[0]
  && Array.isArray(level.definitions) && level.definitions.length === level.words.length
  && Array.isArray(level.links) && level.links.length === level.words.length - 1;

class ZincirState {
  static START_GOLD = START_GOLD;
  static LETTER_COST = LETTER_COST;
  static HINT_COST = HINT_COST;
  static LEVEL_GOLD = LEVEL_GOLD;
  static LEVEL_SCORE = LEVEL_SCORE;

  constructor(content, storage = storageDefault()) {
    this.storage = storage;
    this.levels = (Array.isArray(content?.levels) ? content.levels : []).filter(validLevel).map(clone);
    this.tutorial = validLevel(content?.tutorial) ? clone(content.tutorial) : {};
    this.lastSaveOk = true;
    this._defaults();
    this.loadLocal();
  }

  _defaults() {
    this.profileName = '';
    this.gold = START_GOLD;
    this.score = 0;
    this.completed = [];
    this.tutorialDone = false;
    this.settings = { sound: true, haptics: true };
    this.progress = {};
    this.currentLevel = {};
    this.activeIndex = 1;
    this.revealed = {};
    this.hintUsed = {};
  }

  setProfile(value) {
    const name = String(value ?? '').trim();
    if (name.length < 2 || name.length > 18 || /[\u0000-\u001f\u007f]/u.test(name)) return false;
    this.profileName = name;
    this.saveLocal();
    return true;
  }

  findLevel(id) {
    return id === 'tutorial' ? this.tutorial : this.levels.find(level => level.id === id) ?? {};
  }

  beginLevel(id) {
    const level = this.findLevel(id);
    if (!level?.words) return false;
    this.currentLevel = clone(level);
    this.activeIndex = 1;
    this.revealed = {};
    this.hintUsed = {};
    const entry = this.progress[id];
    if (object(entry) && entry.activeIndex >= 1 && entry.activeIndex < level.words.length) {
      this.activeIndex = entry.activeIndex;
      this.revealed = clone(entry.revealed ?? {});
      this.hintUsed = clone(entry.hintUsed ?? {});
    }
    this.saveLocal();
    return true;
  }

  isComplete() {
    return Boolean(this.currentLevel.words && this.activeIndex >= this.currentLevel.words.length);
  }

  currentWord() {
    return this.answerWord();
  }

  answerWord(wordIndex = -1) {
    const index = wordIndex < 0 ? this.activeIndex : wordIndex;
    return this.currentLevel.answers?.[index] ?? '';
  }

  stemWord(wordIndex = -1) {
    const index = wordIndex < 0 ? this.activeIndex : wordIndex;
    return this.currentLevel.words?.[index] ?? '';
  }

  currentDefinition() {
    return this.currentLevel.definitions?.[this.activeIndex] ?? '';
  }

  visibleLetters(wordIndex = -1) {
    const index = wordIndex < 0 ? this.activeIndex : wordIndex;
    const word = index < this.activeIndex ? this.stemWord(index) : this.answerWord(index);
    if (!word) return [];
    const positions = this.revealed[String(index)] ?? [];
    return [...word].map((letter, position) => index < this.activeIndex || position === 0 || positions.includes(position) ? letter : '');
  }

  submitGuess(value) {
    if (!this.currentLevel.words || this.isComplete()) return { ok: false, complete: this.isComplete(), reason: 'inactive', rewardGold: 0, rewardScore: 0 };
    const word = this.currentWord();
    const guess = normalizeTurkish(value);
    const shown = this.visibleLetters();
    const hidden = [...word].filter((_, index) => !shown[index]).join('');
    if (guess !== word && word[0] + guess !== word && guess !== hidden) {
      return { ok: false, complete: false, reason: 'incorrect', word: '', rewardGold: 0, rewardScore: 0 };
    }
    const solvedIndex = this.activeIndex;
    const stem = this.stemWord();
    this.activeIndex += 1;
    let rewardGold = 0;
    let rewardScore = 0;
    if (this.isComplete()) {
      const id = this.currentLevel.id;
      if (id === 'tutorial') this.tutorialDone = true;
      else if (!this.completed.includes(id)) {
        this.completed.push(id);
        rewardGold = LEVEL_GOLD;
        rewardScore = LEVEL_SCORE;
        this.gold += rewardGold;
        this.score += rewardScore;
      }
    }
    this.saveLocal();
    return { ok: true, complete: this.isComplete(), reason: '', word, stem, solvedIndex, rewardGold, rewardScore };
  }

  revealLetter() {
    if (!this.currentLevel.words || this.isComplete()) return { ok: false, reason: 'inactive' };
    const word = this.currentWord();
    const shown = this.visibleLetters();
    const hidden = [...word].map((_, i) => i).filter(i => i > 0 && !shown[i]);
    if (!hidden.length) return { ok: false, reason: 'all_revealed' };
    if (this.gold < LETTER_COST) return { ok: false, reason: 'insufficient_gold' };
    const index = hidden[Math.floor(Math.random() * hidden.length)];
    const key = String(this.activeIndex);
    if (!Array.isArray(this.revealed[key])) this.revealed[key] = [];
    this.revealed[key].push(index);
    this.gold -= LETTER_COST;
    this.saveLocal();
    return { ok: true, reason: '', index, letter: word[index] };
  }

  buyHint() {
    if (!this.currentLevel.words || this.isComplete()) return { ok: false, reason: 'inactive', text: '' };
    const key = String(this.activeIndex);
    if (!this.hintUsed[key]) {
      if (this.gold < HINT_COST) return { ok: false, reason: 'insufficient_gold', text: '' };
      this.hintUsed[key] = true;
      this.gold -= HINT_COST;
      this.saveLocal();
    }
    return { ok: true, reason: '', text: this.currentDefinition() };
  }

  _storeCurrent() {
    if (this.currentLevel.id) this.progress[this.currentLevel.id] = {
      answerSchema: ANSWER_SCHEMA,
      activeIndex: this.activeIndex,
      revealed: clone(this.revealed),
      hintUsed: clone(this.hintUsed),
    };
  }

  saveLocal() {
    this._storeCurrent();
    if (!this.storage) { this.lastSaveOk = false; return false; }
    const record = JSON.stringify({ version: 1, profileName: this.profileName, gold: this.gold,
      score: this.score, completed: this.completed, tutorialDone: this.tutorialDone,
      settings: this.settings, progress: this.progress });
    try {
      const previous = this.storage.getItem(SAVE_KEY);
      // localStorage.setItem is atomic; preserve the previous valid snapshot too.
      if (this._parse(previous)) {
        try { this.storage.setItem(SAVE_KEY + '.bak', previous); } catch { /* Primary remains usable if quota is tight. */ }
      }
      this.storage.setItem(SAVE_KEY, record);
      this.lastSaveOk = true;
    } catch { this.lastSaveOk = false; }
    return this.lastSaveOk;
  }

  _parse(value) {
    try { const data = JSON.parse(value); return object(data) && data.version === 1 ? data : null; }
    catch { return null; }
  }

  loadLocal() {
    if (!this.storage) return false;
    let data;
    try { data = this._parse(this.storage.getItem(SAVE_KEY)) ?? this._parse(this.storage.getItem(SAVE_KEY + '.bak')); }
    catch { return false; }
    if (!data) return false;
    this.currentLevel = {};
    this.activeIndex = 1;
    this.revealed = {};
    this.hintUsed = {};
    this.profileName = String(data.profileName ?? '').trim().slice(0, 18);
    this.gold = integer(data.gold, START_GOLD);
    this.score = integer(data.score);
    this.tutorialDone = data.tutorialDone === true;
    this.completed = Array.isArray(data.completed) ? [...new Set(data.completed.filter(id => id !== 'tutorial' && this.findLevel(id).words))] : [];
    if (object(data.settings)) this.settings = { sound: data.settings.sound !== false, haptics: data.settings.haptics !== false };
    this.progress = {};
    let migrated = false;
    if (object(data.progress)) for (const [id, entry] of Object.entries(data.progress)) {
      const level = this.findLevel(id);
      if (!level.words || !object(entry)) continue;
      const activeIndex = Math.max(1, integer(entry.activeIndex, 1, level.words.length));
      const revealed = {};
      const hintUsed = {};
      const legacy = entry.answerSchema !== ANSWER_SCHEMA;
      if (legacy) migrated = true;
      for (let index = 1; index < level.words.length; index++) {
        const positions = entry.revealed?.[String(index)];
        const oldWord = legacy ? level.words[index] : level.answers[index];
        const paidPositions = Array.isArray(positions) ? [...new Set(positions.filter(position => Number.isInteger(position) && position > 0 && position < oldWord.length))] : [];
        revealed[String(index)] = paidPositions.filter(position => {
          if (!legacy || oldWord[position] === level.answers[index][position]) return true;
          this.gold = Math.min(99999999, this.gold + LETTER_COST);
          return false;
        });
        hintUsed[String(index)] = entry.hintUsed?.[String(index)] === true;
      }
      this.progress[id] = { answerSchema: ANSWER_SCHEMA, activeIndex, revealed, hintUsed };
    }
    // Commit refunds together with the schema marker before another reload.
    if (migrated) this.saveLocal();
    return true;
  }

  resetProgress() {
    this._defaults();
    return this.saveLocal();
  }
}

}

function entryMapping() {
  const input=wordInput(),entered=normalizeTurkish(input?.value||''), known=state.visibleLetters();

  let pointer=0;const map={};
  known.forEach((l,i)=>{if(l)return;if(whole)map[i]=entered[i];else if(pointer<entered.length)map[i]=entered[pointer++];});
  return {entered,known,map};
}

    transitioning=true;
    const main=app.querySelector('main');main.dataset.transitioning='true';main.setAttribute('aria-busy','true');
    main.querySelectorAll('[data-testid="submit-guess"], [data-testid="reveal-letter"], [data-testid="hint"]').forEach(b=>b.disabled=true);
    sound(result.complete?'win':'good');
    if(state.settings.haptics&&navigator.vibrate)navigator.vibrate(30);
    await morphWord(row,result,token);
    if(token!==transitionToken||screen!=='game')return;
    transitioning=false;
    if(result.complete){lastResult=result;document.activeElement?.blur();win();}
    else {game({focus:focused,scroll:true});toast(`Bağlantı tamam! ${state.currentLevel.links[state.activeIndex-2]}`,true);}
  } else {
    sound('bad');const f=app.querySelector('.feedback');
    const entered=normalizeTurkish(wordInput()?.value||'');
    const bare=state.stemWord();
    f.textContent=entered===bare||entered===bare.slice(1)?'Tamlamadaki hâlini yaz; kelimenin eklerini de tamamla.':'Bu bağlantı olmadı. Bir daha dene; altının azalmaz.';
    f.classList.add('error');
    const row=app.querySelector('[data-mode="active"]');row.classList.remove('shake');void row.offsetWidth;row.classList.add('shake');
  }
}
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function morphWord(row,result,token) {
  const full=result.word, stem=result.stem;
  const cells=row.querySelector('.letter-cells');
  row.dataset.mode='revealing';
  row.querySelector('.word-meta span:nth-child(2)').textContent='BAĞLANTI TAMAM!';
  row.querySelectorAll('.word-tile').forEach((tile,i)=>{tile.textContent=full[i];tile.classList.add('fixed');});
  const feedback=app.querySelector('.feedback');
  feedback.className='feedback morph-feedback';
  feedback.innerHTML=`${esc(full)} <span aria-hidden="true">→</span> <strong>${esc(stem)}</strong><span class="morph-caption">Zincire ${esc(stem)} ile devam.</span>`;
  if(reducedMotion()){await delay(80);return;}
  row.classList.add('word-correct');
  await delay(230);
  if(token!==transitionToken)return;
  let prefix=0;while(prefix<Math.min(full.length,stem.length)&&full[prefix]===stem[prefix])prefix++;
  row.querySelectorAll('.word-tile').forEach((tile,i)=>{if(i>=prefix)tile.classList.add(i>=stem.length?'letter-leaving':'letter-changing');});
  await delay(200);
  if(token!==transitionToken)return;
  const before=[...cells.children].map(tile=>tile.getBoundingClientRect());
  cells.style.setProperty('--letters',stem.length);
  cells.innerHTML=[...stem].map((letter,i)=>`<span class="word-tile fixed" data-testid="letter-cell" data-position="${i}">${esc(letter)}</span>`).join('');
  row.dataset.mode='morphing';
  [...cells.children].forEach((tile,i)=>{
    const old=before[i], now=tile.getBoundingClientRect();
    if(old&&tile.animate)tile.animate([{transform:`translateX(${old.left-now.left}px) scaleX(${old.width/now.width})`,opacity:i>=prefix ? 0.5 : 1},{transform:'none',opacity:1}],{duration:210,easing:'cubic-bezier(.2,.8,.2,1)'});
  });
  row.classList.remove('word-correct');row.classList.add('word-settled');
  await delay(310);
}
function joker(kind) {
  if(screen!=='game'||transitioning)return;
  const draft=draftByPosition(),result=kind==='reveal'?state.revealLetter():state.buyHint();
  if(result.ok){sound();game({draft,scroll:true});toast(kind==='reveal'?'Bir harf açıldı. Bağlantı sana kaldı!':result.text,true);}
  else toast(result.reason==='insufficient_gold'?`${kind==='reveal'?20:15} altın gerekiyor.`:'Bu kelimede açılacak başka harf kalmadı.');
}
function win() {
  const l=state.currentLevel,tutorial=l.id==='tutorial',next=nextLevel();
  setScreen('win',`<div class="stack">${mascot('win-mascot')}${tag('BAĞLANTILAR TAMAM!')}<h1>İşte bu, zincir sende!</h1><p>${tutorial?'Artık hazırsın! Tamlamayı yaz, kelimenin köküyle devam et. Kendi kelime yolculuğuna başlayabilirsin.':'Bir bağlantı daha keşfettin. Kelime yolculuğun büyümeye devam ediyor.'}</p><section class="panel summary">${l.words.map((w,i)=>`<h3>${esc(w)}</h3>${l.links[i]?`<p>↳ ${esc(l.links[i])}</p>`:''}`).join('')}</section>${!tutorial?`<div class="rewards"><span class="row">${icon('coin')}+${lastResult.rewardGold||0} altın</span><span class="score">+${lastResult.rewardScore||0} puan</span></div>${!lastResult.rewardGold?'<p class="muted small">Bu bölümün ödülünü daha önce aldın. Yeni ödüller için yeni zincirleri çöz.</p>':''}`:''}${btn(tutorial?'ANA MENÜYE →':next?'SIRADAKİ ZİNCİR →':'ANA MENÜYE →',tutorial||!next?'home':'play','full','data-testid="win-primary"')}${tutorial&&next?btn('İLK ZİNCİRİ ÇÖZ','play','white full'):!tutorial?btn('BÖLÜMLERE DÖN','levels','white full'):''}</div>`,'win');
}
function party(newChain=true) {
  if(newChain||!partyLevel){const choices=state.levels.filter(l=>l.id!==partyLevel?.id);partyLevel=choices[Math.floor(Math.random()*choices.length)];partyCount++;}
  setScreen('party',`${bar('Parti zamanı!',true)}<div class="stack"><div class="row spread">${tag('HEP BİRLİKTE OYNAYIN')}<span class="small muted">Zincir ${String(partyCount).padStart(2,'0')}</span></div><h1>Kelimeler masada.</h1><p>Sırayla bir kelime söyleyin, bağlantısını açıklayın. Yeni bir tur için zincire dokunun.</p><section class="panel outlined party-chain" data-action="party-next"><span class="eyebrow">${esc(partyLevel.category.toLocaleUpperCase('tr-TR'))}</span>${partyLevel.words.map((w,i)=>`${btn(esc(w),'party-next','full')}${partyLevel.links[i]?`<p class="party-link">↓ ${esc(partyLevel.links[i])}</p>`:''}`).join('')}</section>${btn('YENİ ZİNCİR ↻','party-next','full','data-testid="party-next"')}<p class="muted small">Parti modunda altın harcanmaz, ilerlemen değişmez. Telefonu arkadaşlarınla paylaşman yeterli.</p></div>`,'narrow');
}
function settings() {
  setScreen('settings',`${bar('Oyuncu kartın',true)}<div class="stack settings-stack"><section class="panel outlined settings-card"><h1>${esc(state.profileName)}</h1><p>${state.completed.length} bölüm · ${state.score} puan</p></section><div class="eyebrow">OYUN AYARLARI</div>${btn(`Sesler: ${state.settings.sound?'AÇIK':'KAPALI'}`,'sound','white full')}${btn(`Titreşim: ${state.settings.haptics?'AÇIK':'KAPALI'}`,'haptics','white full')}${btn('ÖĞRETİCİYİ TEKRAR OYNA','tutorial','gold full')}<p class="muted">İlerleme bu cihazda otomatik kaydedilir. Aynı tarayıcı ve adresle devam edebilirsin.</p><section class="panel rules"><strong>NASIL OYNANIR?</strong><p>İlk kelime açık. Sonraki kelimenin ilk harfi ve uzunluğu hazır. Kutulara dokun, eksik harfleri yaz ve kontrol et. Tamlamayı ekleriyle yaz: SU + BARDAĞI gibi. Cevap kısa bir animasyonla BARDAK olur; sıradaki bağlantıyı bu kökle kur.</p><br><p>Harf: 20 altın · Tanım ipucu: 15 altın<br>Yeni bölüm: +40 altın · +100 puan</p><br><span class="muted small">Sözcük Zinciri · Türkçe · v1.2</span></section></div>`,'narrow');
}
function online() {
  setScreen('online',`${bar('Karşılıklı 1v1',true)}<div class="stack">${icon('lock')}${tag('GELECEK GÜNCELLEMEDE')}<h1>Dostça bir rekabet.</h1><p>Oda kodu, eş zamanlı başlangıç, canlı rakip skoru ve kısa mesajlar bu modun bir parçası olacak. Bu sürümde tek kişilik macera ve yüz yüze parti modu hazır.</p>${btn('MACERAYA DÖN →','home','full')}</div>`,'narrow');
}

app.addEventListener('click',event=>{
  const target=event.target.closest('[data-action]');if(!target||target.disabled)return;
  const action=target.dataset.action;
  if(action==='home'&&screen==='game'&&!state.tutorialDone){toast('Birlikte üç kelimeyi bulalım. Çok az kaldı!');return;}
  if(action==='submit')return submit();
  if(action==='reveal'||action==='hint')return joker(action);
  sound();
  switch(action){
    case 'home':home();break;
    case 'play':{const next=nextLevel();next?startLevel(next.id):levels();break;}
    case 'levels':levels();break;
    case 'category':category=target.dataset.category;levels();break;
    case 'level':{const l=state.findLevel(target.dataset.id);if(l&&available(l))startLevel(l.id);break;}
    case 'party':party();break;
    case 'party-next':party();break;
    case 'settings':settings();break;
    case 'online':online();break;
    case 'tutorial':startLevel('tutorial');break;
    case 'sound':state.settings.sound=!state.settings.sound;state.saveLocal();settings();break;
    case 'haptics':state.settings.haptics=!state.settings.haptics;state.saveLocal();settings();break;
  }
});
app.addEventListener('submit',event=>{if(event.target.id!=='profile-form')return;event.preventDefault();const input=app.querySelector('#profile-name');if(state.setProfile(input.value)){input.blur();startLevel('tutorial');}else toast('En az 2 harften oluşan bir isim yaz.');});
app.addEventListener('beforeinput',event=>{if(transitioning&&event.target.matches('.word-input'))event.preventDefault();});
app.addEventListener('input',event=>{if(event.target.matches('.word-input')&&!event.isComposing&&!transitioning)paintInput();});
app.addEventListener('compositionend',event=>{if(event.target.matches('.word-input'))paintInput();});
app.addEventListener('keydown',event=>{if(event.target.matches('.word-input')&&event.key==='Enter'&&!event.isComposing){event.preventDefault();submit();}else if(event.key==='Escape'&&state.profileName&&(state.tutorialDone||screen!=='game'))home();});
app.addEventListener('focusin',event=>{if(event.target.matches('input')){document.body.classList.add('is-typing');if(event.target.matches('.word-input'))requestAnimationFrame(scrollActive);}});
app.addEventListener('focusout',()=>{setTimeout(()=>{if(!document.activeElement?.matches('input'))document.body.classList.remove('is-typing');},80);});
function viewportChanged(){const vv=window.visualViewport;document.documentElement.style.setProperty('--vvh',`${vv?.height||innerHeight}px`);document.documentElement.style.setProperty('--keyboard-inset',`${Math.max(0,innerHeight-(vv?.height||innerHeight))}px`);if(document.activeElement?.matches('.word-input'))requestAnimationFrame(scrollActive);}
window.visualViewport?.addEventListener('resize',viewportChanged);window.addEventListener('resize',viewportChanged);
window.addEventListener('pagehide',()=>state?.saveLocal());
viewportChanged();
try {
	const embedded=document.querySelector('#game-content');
	let content;
	if(embedded)content=JSON.parse(embedded.textContent);
	else {const response=await fetch('data/levels.json');if(!response.ok)throw new Error(`Content ${response.status}`);content=await response.json();}
	state=new ZincirState(content);
  if(!state.profileName)profile();else if(!state.tutorialDone)startLevel('tutorial');else home();
}catch(error){console.error(error);app.innerHTML=`<main class="boot"><h1>Kelimeler yüklenemedi.</h1><p>Bağlantını kontrol edip yeniden dene.</p><button class="btn" onclick="location.reload()">YENİDEN DENE</button></main>`;}

</script>
